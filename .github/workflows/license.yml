name: Acquire Unity License

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # Run monthly (licenses expire)

jobs:
  request-alf:
    name: Request .alf file
    runs-on: ubuntu-latest
    outputs:
      alf: ${{ steps.request-alf.outputs.alf }}
    steps:
      - name: Request floating license
        id: request-alf
        uses: game-ci/request-activation-file@v2

  activate-license:
    name: Activate license
    needs: request-alf
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Activate the license
        run: |
          unity-license-activate \
            "${{ secrets.UNITY_EMAIL }}" \
            "${{ secrets.UNITY_PASSWORD }}" \
            "${{ needs.request-alf.outputs.alf }}"

      - name: Read ULF file
        id: ulfRead
        uses: juliangruber/read-file-action@v1
        with:
          path: ${{ env.ULF_FILE }}

      - name: Update UNITY_LICENSE secret
        uses: hmanzur/actions-set-secret@v2
        with:
          name: 'UNITY_LICENSE'
          value: ${{ steps.ulfRead.outputs.content }}
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Upload error screenshot (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_error
          path: error.png
          if-no-files-found: ignore
