name: Acquire Unity License

on:
  workflow_dispatch:

jobs:
  acquire-ulf:
    name: Acquire .ulf file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload ALF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Activate the license
        run: |
          unity-license-activate \
            "${{ secrets.UNITY_EMAIL }}" \
            "${{ secrets.UNITY_PASSWORD }}" \
            "${{ steps.getManualLicenseFile.outputs.filePath }}"

      - name: Read ULF file
        id: ulfRead
        uses: juliangruber/read-file-action@v1
        with:
          path: ${{ env.ULF_FILE }}

      - name: Update UNITY_LICENSE secret
        uses: hmanzur/actions-set-secret@v2
        with:
          name: 'UNITY_LICENSE'
          value: ${{ steps.ulfRead.outputs.content }}
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Upload ULF as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: license-file
          path: ${{ env.ULF_FILE }}

      - name: Upload error screenshot (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_error
          path: error.png
          if-no-files-found: ignore
